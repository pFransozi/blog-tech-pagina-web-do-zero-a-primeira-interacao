<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu blog tech</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: #183c63;
            color: white;
            text-align: center;
            padding: 32px 16px;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        article {
            display: flex;
            gap: 20px;
            align-items: flex-start;

            background: white;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 16px;
        }

        article img {
            width: 110px;
            height: 110px;
        }

        .autor {
            font-weight: bold;
        }
    </style>

</head>
<body>
    <header>
        <h1>🚀 Meu blog tech</h1>
        <p>Aprendendo tecnologia passo a passo.</p>
    </header>

    <main>

        <article>
            <img
                src="assets/blog-tech.svg"
                alt="Ilustração de um computador com símbolos de tecnologia"
            >
            <div>
                <h2>💻 Meu primeiro post</h2>
                <p class="autor">Por: Seu nome</p>
                <p>
                    Estou construindo uma página usando HTML,
                    CSS, JavaScript e GitHub.
                </p>

                <div class="reacoes">
                    <button>❤️ <span>0</span></button>
                    <button>👍 <span>0</span></button>
                </div>
            </div>
        </article>

        <article>
            <img
                src="assets/blog-tech.svg"
                alt="Ilustração de um computador com símbolos de tecnologia"
            >
            <div>
                <h2>🌐 Meu site está na internet</h2>
                <p class="autor">Por: Seu nome</p>
                <p>
                    Agora o projeto está salvo no GitHub e publicado
                    usando GitHub Pages.
                </p>

                <div class="reacoes">
                    <button>❤️ <span>0</span></button>
                    <button>👍 <span>0</span></button>
                </div>
            </div>
        </article>

    </main>
    <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach(function (botao) {
            botao.addEventListener("click", function () {
                const contador = botao.querySelector("span");
                contador.textContent++;
            });
        });
    </script>
</body>
</html>
